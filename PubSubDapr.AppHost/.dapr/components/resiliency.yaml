apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: pubsub-resiliency
spec:
  # 1. Define the policies
  policies:
    retries:
      pubsubRetry:
        policy: exponential
        duration: 5s
        maxInterval: 60s
        maxRetries: 5
    
    timeouts:
      pubsubTimeout:
        duration: 30s

    circuitBreakers:
      pubsubCB:
        maxRequests: 1
        interval: 30s
        timeout: 30s
        trip: consecutiveFailures >= 5

  # 2. Apply policies to the pub/sub component
  targets:
    components:
      my-pubsub: # Must match the 'name' in your pubsub component spec
        retry: pubsubRetry
        timeout: pubsubTimeout
        circuitBreaker: pubsubCB
